[Main]
bEnabled = true
iLogLevel = 2

[NativeAnimation]
; Applies Bethesda's complete native arm, hand/finger, Weapon, and WeaponLeft
; reload motion over ROCK's live controller/IK pose.
bNativeReloadAnimationAuthorityTestEnabled = true

; Keeps Weapon controller-owned and publishes only substantial native hand/IK
; motion. Bolt/lever cycling and revolver hammer cocking retain the
; right-primary full-two-hand safety gate.
bNativeReloadAnimationPartialAuthorityTestEnabled = true

[Debug]
; Draws Paper's native weapon frame, native hand targets, ROCK live grip
; targets, applied FRIK hands, and their target-error lines through ROCK's
; stereo debug renderer. Diagnostic only; disabled for normal play.
bDebugDrawNativeAnimation = false

; Adds concise mode, capture, and per-hand motion/error labels.
bDebugDrawNativeAnimationText = true

; World-space size in game units for transform axes and cross markers.
fDebugNativeAnimationAxisLength = 5.0
fDebugNativeAnimationMarkerSize = 1.5
